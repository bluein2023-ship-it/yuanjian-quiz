<style>
:root{--ink:#293040;--muted:#626471;--paper:#fff;--line:#e9e1da;--plum:#4d3d73;--gold:#a66e14;--serif:"Songti SC","Noto Serif CJK SC","Noto Serif SC",SimSun,STSong,serif}

['夜潮','鼠','农历十一月','正北','水 · 泽、沅、润、澜','金 · 铭、锦、钧、铮']
];
const showLove = ['把看到的小东西拍下来分享','顺手带一份喜欢的东西','把共同话题变成下次邀约','悄悄记下一个小细节，等合适的时候再提'];
const reply = ['可以直接说「想见」','善于用一个具体时间表达愿意','更愿意等散场后把话说完整','希望先确定对方也想见'];
const change = ['「我们换到哪天方便？」','「我先看一下这周的安排，今晚给你答复。」','「我想缓一缓，等会儿再跟你确认。」','「你确定了新时间，再发给我，好吗？」'];
const friction = ['先各说一次自己在意什么，再一起商量','让对方把意思说完，也给自己留一句回应','给彼此一点时间，顺便说好什么时候接着聊','指出具体哪句话让你不舒服，给对方澄清的机会'];
const nextMeet = ['给出两个时间，也看看 TA 是否愿意一起定下来','问候近况时，可以顺带说你还想再见','留一次邀请给对方，看看 TA 会不会提出安排','照常过自己的日子，等你真有意愿再决定要不要开口'];
const reminders = [
['约','看约定能不能兑现','留意 TA 改约以后会不会给出下一个具体时间。'],
['听','给分歧留一个开口','碰到不同意见，选一件小事说清楚，看彼此能不能听完。'],
['缓','留一点各自的空间','想自己待一晚可以直说，也可以顺手约好下一次见面。'],
['明','说清楚想怎样继续','相处几次都舒服，可以问一句「你也想继续认真了解彼此吗？」']
];
const draws = ['缘起牌','良人牌','提醒牌'];
const reminderSeal = ['留在见面前','留在相处时','留在下次开口前'];
const app = document.querySelector('#app');
const answers = [];
const picks = [];
let step = -1;

function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function action(label, onClick, className) {
  const button = el('button', label, className);
  button.type = 'button';
  button.addEventListener('click', onClick);
  return button;
}

function move(index) {
  step = index;
  render();
  window.scrollTo(0, 0);
  if (step >= 0) app.querySelector('h1, h2').focus({preventScroll:true});
}

function meter(section) {
  const meta = el('div', '', 'meta');
  meta.append(el('span', section), el('span', (step + 1) + ' / 20'));
  const progress = el('progress');
  progress.max = 20;
  progress.value = step + 1;
  progress.setAttribute('aria-label', '测试进度');
  return [meta, progress];
}

const chapterNames = ['正缘', '良人', '提醒'];
const branchSymbols = ['☲ 离', '☳ 震', '☶ 艮', '☵ 坎'];
const hiddenSymbols = ['☴ 巽', '☶ 艮', '☷ 坤'];
const lookTags = ['利落', '松弛', '安静', '亲和'];
const mannerTags = ['有主见', '会顾及他人', '幽默', '务实'];
const signTags = ['记得细节', '有分寸', '善于安排', '耐心'];
const contrastTags = ['熟了健谈', '享受独处', '愿意倾听', '守约'];
const extraElements = ['土 · 磊、城、宇、安', '木 · 林、桐、栩、棠', '火 · 灵、旭、昊、煦'];
const sampleAnswers = [0,0,2,1,2,2,0,1,1,2,1,2,2,1,1,3,2];

function reportCard(title) {
  const card = el('article', '', 'report-card');
  card.append(el('h3', title));
  return card;
}

function tile(label, value, className) {
  const box = el('div', '', className);
  box.append(el('span', label), el('strong', value));
  return box;
}

function report(choices, draws, preview) {
  const a = number => choices[number - 1];
  const encounter = encounters[a(3)];
  const fate = fateCards[draws[0]];
  const person = peopleCards[draws[1]];
  const job = jobs[a(9)];
  const reminder = reminders[a(16)];
  const letter = questions[16][a(17) + 1];
  const heading = el('h1', preview ? '姻缘推演 · 示例结果' : '你的姻缘推演', 'report-heading');
  heading.tabIndex = -1;
  app.replaceChildren(heading);

  const chapters = chapterNames.map((name, index) => {
    const section = el('section', '', 'report-chapter');
    const title = el('h2', '', 'chapter-title');
    title.append(el('span', '0' + (index + 1)), document.createTextNode(name));
    section.append(title);
    app.append(section);
    return section;
  });

  const distance = reportCard('正缘离你有多远');
  const pairs = el('div', '', 'report-pair');
  pairs.append(tile('明缘 · ' + encounter[2], branchSymbols[a(3)], 'trigram'),
    tile('暗缘 · ' + fate[0], hiddenSymbols[draws[0]], 'trigram'));
  distance.append(el('p', encounter[0], 'report-state'),
    el('p', '想象一个从' + place[a(1)] + '展开的故事。' + entry[a(2)] + '。' + encounter[1] + afterglow[a(4)]), pairs);

  const date = reportCard('缘分何时更近');
  const dateBody = el('div', '', 'date-body');
  const dateCopy = el('div');
  dateCopy.append(el('span', '牌面应期 · 桃花旺的属相年', 'report-label'),
    el('strong', fate[2], 'zodiac-year'), el('p', timing[a(5)]) );
  dateBody.append(el('div', '应期', 'round-seal'), dateCopy);
  date.append(dateBody);
  chapters[0].append(distance, date);

  const portrait = reportCard('TA是什么样的人');
  const tags = el('ul', '', 'portrait-tags');
  [lookTags[a(6)], mannerTags[a(7)], signTags[a(8)], contrastTags[a(10)]]
    .forEach(tag => tags.append(el('li', tag)));
  portrait.append(el('p', '故事里的 TA ' + looks[a(6)] + '，遇事' + manners[a(7)] + '。' + contrasts[a(10)] + '。'), tags);
  const work = reportCard('TA的身份和工作');
  const rows = el('dl', '', 'detail-rows');
  [['身份', job[0]], ['职业', job[1]]].forEach(([label, value]) => {
    const row = el('div');
    row.append(el('dt', label), el('dd', value));
    rows.append(row);
  });
  work.append(rows);
  const recognition = reportCard('如何认出TA');
  const clues = el('div', '', 'report-clues');
  ['属相', '生月', '方位'].forEach((label, index) => {
    clues.append(tile(label, person[index + 1], 'clue-tile'));
  });
  recognition.append(clues, el('p', '留意这个细节。TA ' + signs[a(8)] + '。'));
  const names = reportCard('TA的名字可能有哪些字');
  [person[4], person[5], extraElements[draws[1]]].forEach(group => {
    const [element, characters] = group.split(' · ');
    const row = el('div', '', 'element-row');
    row.dataset.element = element;
    const label = el('div', '', 'element-label');
    label.append(el('strong', element), el('small', '五行'));
    row.append(label, ...characters.split('、').map(character => el('span', character, 'character')));
    names.append(row);
  });
  names.append(el('small', '名字字象为缘牌意象。'));
  chapters[1].append(portrait, work, recognition, names);

  const note = reportCard('这段缘分最需注意什么');
  const seal = el('div', reminder[0], 'round-seal reminder-seal');
  note.append(seal, el('p', reminder[1], 'reminder-title'));
  const suggestions = [
    ['留意这件事', reminder[2]],
    ['给见面留时间', timing[a(5)]],
    ['没约成下一次时', nextMeet[a(15)] + '。'],
    ['相处有分歧时', friction[a(14)] + '。'],
    [reminderSeal[draws[2]] + '的便签', letter]
  ];
  suggestions.forEach(([title, copy]) => {
    const panel = el('div', '', 'advice-panel');
    panel.append(el('h4', title), el('p', copy));
    note.append(panel);
  });
  const self = reportCard('你是个什么样的人');
  self.append(el('p', '有好感时，你往往会' + showLove[a(11)] + '。当对方问你愿不愿意再见，你' + reply[a(12)] + '。'));
  const together = reportCard('感情里可以怎样相处');
  ['计划临时变动时，可以说' + change[a(13)],
    '如果你留意到 TA ' + signs[a(8)] + '，相处时也可以告诉 TA，哪些细节对你很重要。'
  ].forEach(copy => together.append(el('p', copy, 'advice-panel')));
  chapters[2].append(note, self, together);

  const footer = el('footer', '', 'report-footer');
  footer.append(el('small', '应期、职业和个人线索为缘牌意象，供娱乐解读。'));
  const nav = el('div', '', 'report-actions');
  nav.append(action('打印或存为 PDF', () => window.print(), 'primary'), action('回到首页', () => {
    answers.length = 0;
    picks.length = 0;
    move(-1);
  }));
  footer.append(nav);
  app.append(footer);
}

function render() {
  const sheet = el('section', '', 'sheet');
  const nav = el('div', '', 'nav');
  let heading;
  app.replaceChildren(sheet);
  if (step < 0) {
    sheet.classList.add('hero');
    heading = el('h1', '你的姻缘推演');
    sheet.append(el('div', '缘', 'seal'), heading, el('p', '从一次偶遇开始，走进十七个场景，再翻开属于这段故事的三张缘牌。'),
      action('开始推演', () => move(0), 'primary'),
      action('预览结果页', () => report(sampleAnswers, [0, 0, 0], true), 'secondary'),
      el('small', '17 道情境题＋3 次翻牌 · 无需登录 · 答案仅在当前页面使用', 'privacy'));
  } else if (step < questions.length) {
    const [title, ...options] = questions[step];
    heading = el('h2', title);
    sheet.append(...meter(step < 5 ? '缘起' : step < 10 ? '良人' : '提醒'), heading);
    const next = action(step === 16 ? '去翻牌' : '下一题', () => move(step + 1), 'primary');
    next.disabled = answers[step] === undefined;
    const buttons = options.map((option, index) => {
      const choice = action('', () => {
        answers[step] = index;
        buttons.forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
        next.disabled = false;
      }, 'option');
      const letter = el('span', 'ABCD'[index]);
      letter.setAttribute('aria-hidden', 'true');
      choice.append(letter, document.createTextNode(option));
      choice.setAttribute('aria-pressed', String(answers[step] === index));
      sheet.append(choice);
      return choice;
    });
    nav.append(action(step ? '上一题' : '返回首页', () => move(step - 1)), next);
    sheet.append(nav);
  } else if (step < 20) {
    const index = step - 17;
    heading = el('h2', '翻开' + draws[index]);
    sheet.append(...meter('翻牌'), heading);
    if (picks[index] === undefined) {
      sheet.append(el('p', '选一张扣着的牌。'));
      const deck = el('div', '', 'deck');
      ['左', '中', '右'].forEach((position, option) => {
        deck.append(action(position, () => {
          picks[index] = option;
          move(step);
        }));
      });
      sheet.append(deck);
    } else {
      const summaries = [
        () => '暗缘 · ' + fateCards[picks[0]][0] + '　应期 · ' + fateCards[picks[0]][2],
        () => '良人 · ' + peopleCards[picks[1]][0] + '　方位 · ' + peopleCards[picks[1]][3],
        () => '提醒 · ' + reminders[answers[15]][0] + '　' + reminderSeal[picks[2]]
      ];
      sheet.append(el('p', summaries[index](), 'insignia'));
      nav.append(action(step === 19 ? '查看完整解读' : '翻下一张', () => move(step + 1), 'primary'));
    }
    nav.prepend(action('返回上一步', () => move(step - 1)));
    sheet.append(nav);
  } else {
    report(answers, picks, false);
    return;
  }
  heading.tabIndex = -1;
}
render();
</script>
</html>
