body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}

.question-page .nav button:not(.primary){background:#f3eff8}
@media(max-width:350px){.question-page{padding-inline:15px}.question-page .question-title{font-size:21px}}

function evaluate(answers){
  const votes=axes.map(()=>[0,0]);
  const numbers=dimensions.map(()=>[]);
  questions.forEach((q,i)=>{
    const answer=answers[i];
    if(q.axis!==undefined){
      votes[q.axis][q.reverse?1-answer:answer]++;
    }else if(answer!==5){
      numbers[q.dim].push(answer*25);
    }
  });
  const type=votes.map(([a,b],i)=>axes[i][a>b?0:1]).join('');
  const values=numbers.map(list=>list.length>=2?list.reduce((a,b)=>a+b,0)/list.length:null);
  const score=values.includes(null)?null:Math.round(values.reduce((a,b)=>a+b,0)/values.length);
  const tier=score===null?null:score<50?0:score<75?1:2;
  return {type,votes,values,score,tier,answers};
}

function radar(values){
  const point=(i,r)=>{
    const angle=i*Math.PI*2/5-Math.PI/2;
    return [180+Math.cos(angle)*r,120+Math.sin(angle)*r];
  };
  const outline=(values)=>values.map((v,i)=>point(i,v*.82).join(',')).join(' ');
  return `<svg viewBox="0 0 360 230" role="img" aria-label="五维近期状态雷达图">${[25,50,75,100].map(n=>`<polygon points="${outline(Array(5).fill(n))}" fill="none" stroke="var(--bright)" stroke-opacity=".24"/>`).join('')}

  ${dimensions.map(([name],i)=>{
    const [x,y]=point(i,101);
    const [cx,cy]=point(i,(values[i]??0)*.82);
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" fill="#4d475d" font-size="13">${name}</text>${values[i]===null?'':`<circle cx="${cx}" cy="${cy}" r="4" fill="white" stroke="var(--bright)" stroke-width="2"/>`}`;
  }).join('')}</svg>`;
}

function evidenceRows(result){
  const {values,answers}=result;
  return dimensions.map(([name],dim)=>{
    const items=questions.map((q,i)=>({q,i,answer:answers[i]})).filter(item=>item.q.dim===dim);
    const known=items.filter(item=>item.answer<5).sort((a,b)=>b.answer-a.answer);
    const first=known[0], last=known.at(-1), note=dimensionNotes[dim];
    const spread=known.length>=2&&first.answer-last.answer>=2;
    const read=item=>`<div class="snapshot"><p>${item.q.prompt}</p><small>你的回答 · ${frequency[item.answer]}</small></div>`;
    const explanation=values[dim]===null?'本次有效情境太少，可以先把这一项留作观察。'
      :spread?'这个维度里，不同场景的回答有明显落差。对照下面两题，想想是环境、对象，还是当时的余力让做法不同。'
      :known.length<4?'已有回答比较接近，还有情境可以留到实际遇见时再看。'
      :'这几道题的回答比较接近。可以拿最近一次具体经历，看看这个频率贴不贴近实际。';
    return `<details class="detail-line"><summary>${name} · ${values[dim]===null?'待观察':Math.round(values[dim])+' 分'} <small>（${known.length}/4 道有效）</small></summary>
      <p class="muted">${note[0]}</p><p>${explanation}</p>${first?read(first):''}${spread?read(last):''}
      <p><strong>下次可以留意</strong> · ${note[2]}</p></details>`;
  }).join('');
}

    :'接下来的一周，可以留意哪一个场景最值得你停下来多看一眼。';
  theme(palette);
  show(`<div class="report-page"><section class="hero"><p class="kicker report-label">${palette[0]} · ${palette[1]}</p><div class="row"><div class="rank"><small>近期状态 · ${stage[1]}</small><h1>${stage[0]}</h1>${tier===null?'':`<div class="hearts" aria-label="${stage[0]}状态标记">${Array.from({length:5},(_,i)=>`<span class="heart" aria-hidden="true">♥<i style="width:${Math.max(0,Math.min(1,hearts-i))*100}%">♥</i></span>`).join('')}</div>`}</div><div class="ring" role="img" aria-label="状态总分 ${score??'待观察'}" style="--score:${score??0}%"><div><b>${score??'—'}</b><small>状态总分</small></div></div></div>
  <h2 class="type-title">${type} · ${p[0]}</h2><div class="tags">${tags.map(tag=>`<span class="tag">${tag}</span>`).join('')}</div><p class="hero-quote">${quote}</p></section><p class="stage-text"><span>${stage[2]}</span><span>${grayDetail}</span></p>
  <section class="card"><h2>五维能量图谱</h2><p class="muted">近 4 周自评 · 每项 0–100 分</p>${radar(values)}
  <div class="stats">${dimensions.map(([name],i)=>`<div><b>${values[i]===null?'—':Math.round(values[i])}</b><small>${name}</small></div>`).join('')}</div>
  ${valid.length?`<div class="band"><strong>更顺手</strong> · ${strongest}<br><strong>可练习</strong> · ${lowest}</div>`:''}
  ${values.includes(null)?'<small>带「—」的维度可评情境不足，雷达图只标出已有分数的点。</small>':''}</section>
  <section class="card"><h2>核心力量与常见卡点</h2><p class="band"><strong>${p[1]}</strong></p><p><strong>这种偏好在哪儿有用</strong> · ${p[7]}等工作场景里，可以观察自己是否喜欢发挥这项倾向。</p><p><strong>用过头时可能怎样</strong> · ${p[2]}</p><p><strong>下次怎么试</strong> · ${p[3]}</p><details><summary>看我的四组偏好</summary>
  ${axes.map((label,i)=>`<div class="metric"><div class="row"><span>${label[0]} · ${votes[i][0]} 题</span><span>${votes[i][1]} 题 · ${label[1]}</span></div><div class="bar"><i style="width:${votes[i][0]/7*100}%"></i></div></div>`).join('')}</details>
  ${borderAxes.length?`<p style="margin-top:12px"><small>${borderAxes.map(s=>s.split('').join('/')).join('、')} 的答案为 4 比 3。换个场景时，你可能更接近另一侧。</small></p>`:''}</section>
  ${energySection(valid,score)}
  <section class="card"><h2>五维解析</h2>
  <p class="muted">展开维度，可以看到它在问什么、你的代表作答和下一次可以观察的细节。</p>
  ${valid.length>1&&!flat?`<p class="band">这次「${dimensions[valid[0].i][0]}」比「${dimensions[valid.at(-1).i][0]}」高约 ${Math.round(valid[0].v-valid.at(-1).v)} 分。可以对照一次近期经历：两种做法分别在什么条件下更容易做到？</p>`:''}
  ${evidenceRows(result)}</section>
  <section class="card"><h2>进化路线</h2><p class="muted">${stage[0]} · 接下来一周挑一项先做</p><ol class="route"><li><strong>从人格卡点入手</strong> · ${p[3]}</li>${practiceSteps(tier,practice)}</ol></section>
  <section class="card"><h2>♡ 恋爱官配</h2><p><small>娱乐向配对 · 用来打开话题</small></p><p><span class="tag" style="color:${partnerColor[2]}">${partnerColor[0]}</span> <strong>${p[4]} · ${partner[0]}</strong></p><p><strong>可能怎样互补</strong> · ${p[5]}</p><p class="band"><strong>遇到节奏差时怎么谈</strong> · ${p[6]}</p><details><summary>约会后可以一起聊</summary><p>最近一次相处里，哪件事让你感到被理解？哪件事需要我下次先问你一声？试着各用一个真实例子来回答。</p></details></section>
  <section class="card"><h2>职业灵感</h2><p>${p[7]}</p><small>这些方向可用来探索自己喜欢的工作内容。</small></section>
  <section class="card"><details><summary>分数怎么算</summary><p>人格偏好每组 7 道二选一，票数较多的一侧组成四字母类型。颜色由类型固定。</p><p>状态题频率依次为 0、25、50、75、100 分。每维至少 2 个有效答案才出分，五维均有效时取未四舍五入的维度分平均、再取整。0–49 为低阶、50–74 为中阶、75–100 为高阶。这些是本测验的体验阈值，供个人回顾与比较。</p></details>
  <div class="row nav"><button id="edit">修改答案</button><button id="reset" class="primary">重新测试</button></div></section></div>`);
  app.querySelector('#edit').onclick=()=>{
    review();
  };
  app.querySelector('#reset').onclick=()=>{
    if(!confirm('清除本次答案并重新开始？'))return;
    state={index:0,answers:[],done:false};save();question();
  };
}
function review(){
  theme();
  show(`<section class="card"><h2>修改答案</h2><p>选一题跳回去修改。改完可以直接更新报告。</p><div class="swatches">${questions.map((q,i)=>`<button style="background:var(--tint)" data-jump="${i}" aria-label="第 ${i+1} 题，${q.prompt}">${i+1}</button>`).join('')}</div><button id="back-report" class="primary" style="margin-top:18px">返回报告</button></section>`);
  app.querySelector('#back-report').onclick=()=>report(evaluate(state.answers));
  app.querySelectorAll('[data-jump]').forEach(button=>button.onclick=()=>{
    state.index=Number(button.dataset.jump);
    save();
    question();
  });
}
if(state.done&&count()===questions.length)report(evaluate(state.answers));
else{state.done=false;question();}
</script></html>
